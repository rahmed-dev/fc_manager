[project]
name = "fc-manager"
version = "1.1.1"
description = "CLI to explore Frappe Cloud teams, benches and sites, and to deploy, migrate and update them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rahmed-dev" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/rahmed-dev/fc_manager"
Issues = "https://github.com/rahmed-dev/fc_manager/issues"
Changelog = "https://github.com/rahmed-dev/fc_manager/blob/main/CHANGELOG.md"

[project.scripts]
fcm = "fc_manager.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fc_manager"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
